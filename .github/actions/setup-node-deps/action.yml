name: Set up Node.js and install dependencies
description: >-
  Install the pinned Node.js version with the npm cache enabled, then run `npm
  ci` so every workflow job installs dependencies the same way. This is the
  single place the CI Node major lives; tests/dev-environment.test.mjs checks it
  against the devcontainer and package.json engines.

inputs:
  node-version:
    description: Node.js version to install.
    required: false
    default: '22'

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
    - name: Install dependencies
      shell: bash
      run: npm ci
