version: 2

# Every entry below declares `cooldown: default-days: 7`. Dependabot already
# waits 3 days before proposing a newly published version when `cooldown` is
# absent, so this is a widening of that implicit default, not a new control.
# Three days is short for the case this guards against: a release published
# from a compromised maintainer account. Those are usually reported and the
# version unpublished or deprecated within about a week, so a 7-day wait lets
# the ecosystem finish triaging before a version update asks this repository's
# lockfile to move. `npm ci` installs the committed lockfile and nothing else,
# so a Dependabot version-update pull request is the only way a new upstream
# version reaches it.
#
# This delays nothing that matters for an advisory: `cooldown` applies to
# version updates only and is never consulted for a security update, so a fix
# for a published vulnerability still arrives the moment Dependabot sees it.
# `default-days` is supported for all three ecosystems configured here
# (github-actions, devcontainers, npm). tests/dependabot-contract.test.mjs
# fails if any entry drops below 7, so the wait cannot be quietly removed.
#
# npm's own `min-release-age` is the equivalent control and is deliberately
# NOT set in .npmrc: it was added in npm 11.10, and this project pins Node 22
# (package.json engines, .github/actions/setup-node-deps, netlify.toml), whose
# bundled npm is 10.x. It would be an unenforced comment there, and Dependabot
# resolves versions itself without reading it.
updates:
  # Actions are pinned to commit SHAs, which never float onto upstream security
  # fixes. Dependabot rewrites the pin and refreshes the trailing version
  # comment, so this is what keeps the pins current. Only labels that already
  # exist in this repository are requested; Dependabot fails a run that names
  # a label it cannot find.
  #
  # `directories`, not `directory`: for the github-actions ecosystem a
  # directory of `/` means `.github/workflows` and the repository-root
  # `action.yml` — and nothing else. Composite actions living in
  # `.github/actions/<name>/action.yml` are not discovered through it, and a
  # workflow's `uses: ./.github/actions/<name>` is a local reference Dependabot
  # does not follow. Their `uses:` pins are nevertheless required to be
  # SHA-pinned with a version comment (tests/composite-action-supply-chain.test.mjs),
  # so without an entry naming them those pins are enforced but never
  # refreshed: frozen at whatever SHA they were written with, for good.
  #
  # Each composite action directory is listed explicitly rather than matched
  # with the `*` glob `directories` also accepts. An entry that resolves to
  # nothing is silently inert — Dependabot reports configuration problems on
  # the repository's Dependabot tab, not on a pull request — and an explicit
  # path is the form tests/dependabot-contract.test.mjs can check against the
  # tree offline, so a new composite action that nobody adds here fails the
  # suite instead of quietly losing its updates.
  - package-ecosystem: 'github-actions'
    directories:
      - '/'
      - '/.github/actions/setup-node-deps'
      - '/.github/actions/open-automation-pr'
      - '/.github/actions/setup-playwright'
    schedule:
      interval: 'weekly'
      day: 'monday'
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
    commit-message:
      prefix: 'chore(deps)'
    groups:
      actions:
        patterns:
          - '*'

  # Dev container Features are pinned to exact versions in
  # .devcontainer/devcontainer.json, and a Feature's install.sh runs as root at
  # image build time. Pins with nothing refreshing them go stale, so this entry
  # is what moves them onto upstream fixes. Dependabot does not ship security
  # updates for this ecosystem, only version updates, which is the whole reason
  # the cadence below is declared rather than left implicit.
  - package-ecosystem: 'devcontainers'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
    commit-message:
      prefix: 'chore(deps)'

  # Security updates arrive without this entry; it adds the version-update
  # cadence so routine drift lands in small batches. Grouped and capped to
  # keep the review queue shallow.
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'javascript'
    commit-message:
      prefix: 'chore(deps)'
    # eslint-plugin-jsx-a11y 6.10.2 — the latest release, unchanged since
    # 2024-10 — declares `peer eslint: ^3 … ^9`, so any group that pulls
    # eslint (or its paired @eslint/js) to a new major cannot `npm install`
    # at all: every job ERESOLVE-fails in the install step, which is what
    # red-lit the weekly group in #1910. Hold the eslint major line here
    # until the plugin ships an eslint-10-compatible release. These ignores
    # are scoped to `version-update:semver-major`, so minor/patch bumps and
    # security updates for the current major are unaffected.
    ignore:
      - dependency-name: 'eslint'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: '@eslint/js'
        update-types:
          - 'version-update:semver-major'
    groups:
      docusaurus:
        patterns:
          - '@docusaurus/*'
          - 'docusaurus-*'
      dev-dependencies:
        dependency-type: 'development'
      production-minor-patch:
        dependency-type: 'production'
        update-types:
          - 'minor'
          - 'patch'
