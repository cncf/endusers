name: Validate repository

on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

# Superseding pushes to the same PR cancel the stale run instead of letting it
# race to completion; merge_group runs never get a duplicate ref, so they
# always finish undisturbed.
concurrency:
  group:
    ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref
    }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests with coverage
        run: npm run test:unit:coverage:check | tee coverage-summary.txt
        shell: bash -o pipefail {0}
      - name: Publish coverage summary
        if: always()
        run: |
          if [ -f coverage-summary.txt ]; then
            { echo '## Unit test coverage'; echo '```'; cat coverage-summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-summary
          path: coverage-summary.txt
      - name: Validate metrics data
        run: npm run validate:metrics
      - name: Validate architectures data
        run: npm run validate:architectures
      - name: Validate architecture assets
        run: npm run validate:architecture-assets
      - name: Validate awards data
        run: npm run validate:awards
      - name: Validate community people data
        run: npm run validate:community-people
      - name: Validate community group links
        run: npm run validate:community-groups
      - name: Validate launch metrics data
        run: npm run validate:launch-metrics
      - name: Validate case studies data
        run: npm run validate:case-studies
      - name: Validate radar reports data
        run: npm run validate:radar-reports
      - name: Validate projects-born data
        run: npm run validate:projects-born
      - name: Validate button contrast
        run: npm run validate:button-contrast
      - name: Validate End User landscape data
        run: npm run validate:enduser-members
      - name: Validate members data
        run: npm run validate:members
      - name: Build production site
        run: npm run build:production
        env:
          SITE_URL: https://cncf.github.io
          BASE_URL: /endusers/

  lint:
    name: Lint repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check formatting
        run: npm run check:format
      - name: Check spelling
        run: npm run check:spelling
      - name: Check markdown
        run: npm run check:markdown

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Resolve Playwright version
        id: playwright-version
        run: >-
          echo "version=$(node -p
          "require('./package-lock.json').packages['node_modules/@playwright/test'].version")"
          >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key:
            playwright-${{ runner.os }}-${{
            steps.playwright-version.outputs.version }}
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright system dependencies
        # The cache restores the browser bundle but not the OS packages it
        # needs, which do not persist across runner images.
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Build production site
        # Deliberately built without SITE_URL/BASE_URL: the suite navigates
        # with paths relative to the site root (playwright.config.js sets
        # baseURL to the bare localhost origin), which only matches a build
        # whose baseUrl is the default "/".
        run: npm run build:production
      - name: Run end-to-end tests
        run: npm run test:e2e
      - name: Upload Playwright traces
        # The CI reporter (playwright.config.js) is 'github', which only
        # annotates the run; it writes no HTML report. Failure traces
        # (trace: 'retain-on-failure') land in test-results/ instead.
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  e2e-coverage:
    name: End-to-end coverage (non-gating)
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUN_DIR: coverage/e2e/${{ github.run_id }}-${{ github.run_attempt }}
      RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Resolve Playwright version
        id: playwright-version
        run: >-
          echo "version=$(node -p
          "require('./package-lock.json').packages['node_modules/@playwright/test'].version")"
          >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key:
            playwright-${{ runner.os }}-${{
            steps.playwright-version.outputs.version }}
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright system dependencies
        # The cache restores the browser bundle but not the OS packages it
        # needs, which do not persist across runner images.
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Initialize coverage run
        run: >-
          node tests/tools/e2e-coverage-run.mjs init --dir "$RUN_DIR" --run-id
          "$RUN_ID"
      - name: Build source-mapped e2e site
        run: npm run build:e2e:coverage
      - name: Run e2e tests with coverage
        id: coverage_tests
        run: npm run test:e2e:coverage
        env:
          E2E_COVERAGE_DIR: ${{ env.RUN_DIR }}
          E2E_COVERAGE_RUN_ID: ${{ env.RUN_ID }}
      - name: Seal coverage run
        if: always()
        run: |
          status=failed
          if [ "${{ steps.coverage_tests.outcome }}" = "success" ]; then
            status=passed
          fi
          node tests/tools/e2e-coverage-run.mjs seal --dir "$RUN_DIR" --status "$status"
      - name: Render e2e coverage report
        if: always()
        run: |
          mkdir -p coverage/e2e/report
          npm run report:e2e:coverage -- \
            --input "$RUN_DIR" \
            --build build \
            --json coverage/e2e/report.json \
            --text coverage/e2e/report.txt
      - name: Publish e2e coverage summary
        if: always()
        run: |
          if [ -f coverage/e2e/report.txt ]; then
            {
              echo '## E2E browser coverage (non-gating)'
              echo '```'
              cat coverage/e2e/report.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo '::error::E2E coverage report was not produced.'
            echo '## E2E browser coverage (non-gating)' >> "$GITHUB_STEP_SUMMARY"
            echo 'Coverage tooling failed before producing a report; inspect the artifact.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload e2e coverage artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-coverage
          path: coverage/e2e/
          if-no-files-found: warn
          retention-days: 7
