name: Validate repository

on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests with coverage
        run: npm run test:unit:coverage:check | tee coverage-summary.txt
        shell: bash -o pipefail {0}
      - name: Publish coverage summary
        if: always()
        run: |
          if [ -f coverage-summary.txt ]; then
            { echo '## Unit test coverage'; echo '```'; cat coverage-summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-summary
          path: coverage-summary.txt
      - name: Validate metrics data
        run: npm run validate:metrics
      - name: Validate architectures data
        run: npm run validate:architectures
      - name: Validate architecture assets
        run: npm run validate:architecture-assets
      - name: Validate awards data
        run: npm run validate:awards
      - name: Validate community people data
        run: npm run validate:community-people
      - name: Validate community group links
        run: npm run validate:community-groups
      - name: Validate launch metrics data
        run: npm run validate:launch-metrics
      - name: Validate case studies data
        run: npm run validate:case-studies
      - name: Validate radar reports data
        run: npm run validate:radar-reports
      - name: Validate button contrast
        run: npm run validate:button-contrast
      - name: Build production site
        run: npm run build:production
        env:
          SITE_URL: https://cncf.github.io
          BASE_URL: /endusers/

  lint:
    name: Lint repository
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check formatting
        run: npm run check:format
      - name: Check spelling
        run: npm run check:spelling
      - name: Check markdown
        run: npm run check:markdown
