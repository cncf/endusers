name: Validate repository

on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

# Superseding pushes to the same PR cancel the stale run instead of letting it
# race to completion; merge_group runs never get a duplicate ref, so they
# always finish undisturbed.
concurrency:
  group:
    ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref
    }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify changed paths
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      document_only: ${{ steps.classify.outputs.document_only }}
      documents_b64: ${{ steps.classify.outputs.documents_b64 }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify changed documents
        id: classify
        run:
          node --input-type=module -e "import { runClassifier } from
          './scripts/lib/content-only-ci.mjs'; runClassifier()"
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_BASE_SHA: ${{ github.event.merge_group.base_sha }}

  validate:
    name: Validate repository
    needs: classify
    outputs:
      document_only:
        ${{ needs.classify.result == 'success' &&
        needs.classify.outputs.document_only == 'true' }}
    if: ${{ !cancelled() }}
    env:
      FULL_VALIDATION:
        ${{ needs.classify.result != 'success' ||
        needs.classify.outputs.document_only != 'true' }}
      CONTENT_ONLY:
        ${{ needs.classify.result == 'success' &&
        needs.classify.outputs.document_only == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js and install dependencies
        uses: ./.github/actions/setup-node-deps
      - name: Audit dependencies against the advisory allowlist
        if: ${{ !cancelled() && env.FULL_VALIDATION == 'true' }}
        run: npm run check:audit
      - name: Run unit tests with coverage
        if: ${{ !cancelled() && env.FULL_VALIDATION == 'true' }}
        # A zone fourteen hours ahead of UTC, so a date formatted in the
        # host zone instead of UTC lands on a different calendar day for most
        # of the day; the suite used to pin TZ=UTC, which hid exactly that.
        env:
          TZ: Pacific/Kiritimati
        run: npm run test:unit:coverage:check | tee coverage-summary.txt
        shell: bash -o pipefail {0}
      - name: Publish coverage summary
        if: ${{ !cancelled() && env.FULL_VALIDATION == 'true' }}
        run: |
          if [ -f coverage-summary.txt ]; then
            { echo '## Unit test coverage'; echo '```'; cat coverage-summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload coverage report
        if: ${{ !cancelled() && env.FULL_VALIDATION == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-summary
          path: coverage-summary.txt
          retention-days: 90
      - name: Validate repository data
        if: ${{ !cancelled() && env.FULL_VALIDATION == 'true' }}
        run: |
          npm run validate:metrics
          npm run validate:architectures
          npm run validate:architecture-assets
          npm run validate:awards
          npm run validate:community-people
          npm run validate:community-groups
          npm run validate:case-studies
          npm run validate:radar-reports
          npm run validate:projects-born
          npm run validate:end-user-talks
          npm run validate:button-contrast
          npm run validate:enduser-members
          npm run validate:members
      - name: Check content contracts
        if: ${{ !cancelled() && env.CONTENT_ONLY == 'true' }}
        # Every unit suite that reads an authored document (docs/, blog/,
        # adr/ or a root document). tests/content-only-ci-workflow.test.mjs
        # scans tests/ for suites that read those trees and fails when one is
        # missing here without a stated reason. tests/audit-gate.test.mjs
        # also reads SECURITY.md, but only in the register checks that now
        # live in tests/security-advisory-register.test.mjs; what stays
        # behind there spends ~40s on the CLI retry and deadline arms, so it
        # stays on the full path.
        run: |
          node --test \
            tests/docs-contract.test.mjs \
            tests/markdown-references.test.mjs \
            tests/community-group-coverage.test.mjs \
            tests/adr-contract.test.mjs \
            tests/architectures-sidebar-contract.test.mjs \
            tests/blog-frontmatter.test.mjs \
            tests/community-people-data.test.mjs \
            tests/content-only-ci-workflow.test.mjs \
            tests/content-security-contract.test.mjs \
            tests/contributing-e2e-setup.test.mjs \
            tests/contributing-just-build-parity.test.mjs \
            tests/dev-environment.test.mjs \
            tests/docs-threshold-parity.test.mjs \
            tests/e2e-docs-threshold-parity.test.mjs \
            tests/enduser-directory-copy.test.mjs \
            tests/governance-hygiene-parity.test.mjs \
            tests/mdx-components.test.mjs \
            tests/mdx-paragraph-nesting.test.mjs \
            tests/root-docs-links.test.mjs \
            tests/security-advisory-register.test.mjs \
            tests/site-config.test.mjs \
            tests/sitemap-exclusions.test.mjs \
            tests/static-assets.test.mjs \
            tests/static-orphans.test.mjs
      - name: Build production site
        run: npm run build:production

  lint:
    name: Lint repository
    needs: classify
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js and install dependencies
        uses: ./.github/actions/setup-node-deps
      - name: Check changed-document formatting, spelling, and Markdown
        if:
          ${{ !cancelled() && needs.classify.result == 'success' &&
          needs.classify.outputs.document_only == 'true' }}
        run:
          node --input-type=module -e "import { runDocumentLint } from
          './scripts/lib/content-only-ci.mjs';
          runDocumentLint(process.env.CHANGED_DOCUMENTS_B64)"
        env:
          CHANGED_DOCUMENTS_B64: ${{ needs.classify.outputs.documents_b64 }}
      - name: Run full repository lint
        if:
          ${{ !cancelled() && (needs.classify.result != 'success' ||
          needs.classify.outputs.document_only != 'true') }}
        run: |
          npm run check:format
          npm run check:spelling
          npm run check:markdown
          npm run check:duplication
          npm run check:lint
          npm run check:unused

  e2e:
    name: End-to-end tests
    needs: [validate, lint]
    if: >-
      ${{ !cancelled() && (needs.validate.result != 'success' ||
      needs.lint.result != 'success' || needs.validate.outputs.document_only !=
      'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js and install dependencies
        uses: ./.github/actions/setup-node-deps
      - name: Install Playwright browsers
        uses: ./.github/actions/setup-playwright
      - name: Build production site
        # Deliberately built without SITE_URL/BASE_URL: the suite navigates
        # with paths relative to the site root (playwright.config.js sets
        # baseURL to the bare localhost origin), which only matches a build
        # whose baseUrl is the default "/".
        run: npm run build:production
      - name: Run end-to-end tests
        run: npm run test:e2e
      - name: Upload Playwright traces
        # The CI reporter (playwright.config.js) is 'github', which only
        # annotates the run; it writes no HTML report. Failure traces
        # (trace: 'retain-on-failure') land in test-results/ instead.
        # Runs on green jobs too: with retries: 1 a flaky spec fails, retries,
        # passes, and the job exits 0 — under `if: failure()` the trace of
        # that first failing attempt was discarded, leaving no evidence to
        # debug the flake (#1179). `!cancelled()` keeps the upload out of
        # cancelled runs, and if-no-files-found: ignore keeps fully green
        # runs quiet instead of warning about an empty test-results/.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  e2e-coverage:
    name: End-to-end coverage
    needs: [classify, validate, lint]
    if: >-
      ${{ !cancelled() && (needs.classify.result != 'success' ||
      needs.classify.outputs.document_only != 'true' || needs.validate.result !=
      'success' || needs.lint.result != 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUN_DIR: coverage/e2e/${{ github.run_id }}-${{ github.run_attempt }}
      RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js and install dependencies
        uses: ./.github/actions/setup-node-deps
      - name: Install Playwright browsers
        uses: ./.github/actions/setup-playwright
      - name: Initialize coverage run
        run: >-
          node tests/tools/e2e-coverage-run.mjs init --dir "$RUN_DIR" --run-id
          "$RUN_ID"
      - name: Build source-mapped e2e site
        run: npm run build:e2e:coverage
      - name: Run e2e tests with coverage
        id: coverage_tests
        run: npm run test:e2e:coverage
        env:
          E2E_COVERAGE_DIR: ${{ env.RUN_DIR }}
          E2E_COVERAGE_RUN_ID: ${{ env.RUN_ID }}
      - name: Seal coverage run
        if: always()
        run: |
          status=failed
          if [ "${{ steps.coverage_tests.outcome }}" = "success" ]; then
            status=passed
          fi
          node tests/tools/e2e-coverage-run.mjs seal --dir "$RUN_DIR" --status "$status"
      - name: Render e2e coverage report
        if: always()
        run: |
          mkdir -p coverage/e2e/report
          npm run report:e2e:coverage -- \
            --input "$RUN_DIR" \
            --build build \
            --check-source 100 \
            --check-source-regions 96 \
            --require-source-files \
            --json coverage/e2e/report.json \
            --text coverage/e2e/report.txt
      - name: Publish e2e coverage summary
        if: always()
        run: |
          if [ -f coverage/e2e/report.txt ]; then
            {
              echo '## E2E browser coverage'
              echo '```'
              cat coverage/e2e/report.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo '::error::E2E coverage report was not produced.'
            echo '## E2E browser coverage' >> "$GITHUB_STEP_SUMMARY"
            echo 'Coverage tooling failed before producing a report; inspect the artifact.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload e2e coverage artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-coverage
          path: coverage/e2e/
          if-no-files-found: warn
          retention-days: 90
      - name: Upload Playwright traces
        # The describeCoverage blocks (E2E_COVERAGE=1) run in this job and
        # nowhere else, so a flake in one of them cannot be diagnosed from the
        # gating e2e job's traces (#1412). Same contract as that job's upload:
        # survives a green run so a pass-on-retry keeps its first attempt, and
        # stays quiet when no spec failed.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces-coverage
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
