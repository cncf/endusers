# Runs `npm run check:links` on a weekly schedule and on demand. That is
# markdown-link-check over every *.md file `_list:check:md` enumerates
# (root-level docs plus docs/, blog/, adr/ and .github/), then
# scripts/check-data-links.mjs over every outbound URL the site renders from
# the data/ files it lists.
#
# This gate deliberately does not run on pull requests: it resolves every
# outbound URL against the live internet, so a third-party outage would fail
# unrelated PRs (the reasoning previously recorded in GATES_NOT_RUN_BY_CI in
# tests/workflow-scripts.test.mjs). A schedule keeps link rot from
# accumulating unnoticed without putting the network between a contributor
# and a green check. See #1188.
name: Check links

on:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-links-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-links:
    name: Check markdown and data links
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-deps
      - run: npm run check:links
