name: Import reference architectures

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  NODE_VERSION: '22'

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y librsvg2-bin
      - run: npm ci
      - run: npm run test:unit
      - run: npm run collect:metrics
      - run: npm run validate:metrics
      - run: npm run import:architectures
      - run: npm run validate:architectures
      - run: npm run validate:architecture-assets
      - run: npm run validate:awards
      - run: npm run build
      - uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          branch: automation/import-architectures
          delete-branch: true
          commit-message: 'chore: import reference architectures'
          title: 'chore: import latest reference architectures'
          body: |
            Automated metrics refresh and architecture import.
            Automated import from https://github.com/cncf/architecture.

            The production build and architecture validation passed.
          labels: automated
