name: Import reference architectures

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  NODE_VERSION: '22'

jobs:
  import:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y librsvg2-bin
      - run: npm ci
      - run: npm run test:unit
      - run: npm run collect:metrics
      - run: npm run validate:metrics
      - run: npm run import:architectures
      - run: npm run validate:architectures
      - run: npm run validate:architecture-assets
      - run: npm run validate:awards
      - run: npm run build
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: automation/import-architectures
          delete-branch: true
          commit-message: 'chore: import reference architectures'
          title: 'chore: import latest reference architectures'
          body: |
            Automated metrics refresh and architecture import.
            Automated import from https://github.com/cncf/architecture.

            The production build and architecture validation passed.
          labels: automated
