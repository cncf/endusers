name: Refresh community profiles

on:
  schedule:
    - cron: '37 2 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# Serialised on the branch this workflow force-pushes; see the note in
# refresh-radar-reports.yml. Not cancelled, for the same reason.
concurrency:
  group: automation/refresh-community-people
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-deps
      - run: npm run fetch:community-people
      - run: npm run check:community-group-links
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm run fix:format
      - run: npm run validate:community-people
      - run: npm run validate:community-groups
      - run: npm run test:unit
      - run: npm run build
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: automation/refresh-community-people
          delete-branch: true
          commit-message: 'chore: refresh community profiles and group status'
          title: 'chore: refresh community profiles and group status'
          body: |
            Automated refresh of the public GitHub profile data used by the End User Community lightboxes, and of the archived/reachable status recorded for each community group in data/community-groups.json.
          labels: automated
          signoff: true
