name: Refresh metrics

on:
  # Daily, offset from the other scheduled workflows so they do not contend
  # for runners. Everything this lane collects (metrics, the case study
  # catalog, the End User Talks schedule) is rendered on the live site and
  # goes visibly stale when it is only refreshed by hand. Each collector
  # rewrites its file only when the content changed (ADR 0009), so a quiet
  # day commits nothing; the daily cadence exists so a conference's schedule
  # is stamped final the morning after its last day rather than up to a week
  # later, when the event page would still say the schedule may change. The
  # end user member list is refreshed by refresh-members.yml: it is the only
  # refresh that mirrors third-party binary assets, and an upstream logo that
  # breaks the 2 MB publish limit must not hold these datasets back (#1980).
  # A maintainer can still trigger it from the Actions tab or `gh workflow
  # run` when upstream changes should land sooner.
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  # collect:metrics lists cncf/tab issues for the reference architecture
  # submission cards. Without this grant the token sees only the pull request
  # entries of that listing, the collector filters them out and the lane
  # publishes 0 open submissions and a 0-day median against a real queue of
  # a dozen (#1878).
  issues: read

# Serialised on the branch this workflow force-pushes; see the note in
# refresh-radar-reports.yml. Not cancelled, for the same reason.
concurrency:
  group: automation/refresh-metrics
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-deps
      - run: npm run collect:metrics
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm run collect:case-studies
      # Fetches only conferences that have not yet ended; a finished schedule
      # is final and is refreshed by hand (see the collector's header).
      - run: npm run collect:end-user-talks
      - run: npm run fix:format
      - run: npm run validate:metrics
      - run: npm run validate:case-studies
      - run: npm run validate:end-user-talks
      - run: npm run test:unit
      - run: npm run build
      - uses: ./.github/actions/open-automation-pr
        with:
          branch: automation/refresh-metrics
          commit-message: 'chore: refresh metrics'
          title: 'chore: refresh metrics'
          body: |
            Automated refresh of `data/metrics.json`,
            `data/case-studies.json` and `data/end-user-talks/`.

            Validation, the unit tests and the production build passed.
