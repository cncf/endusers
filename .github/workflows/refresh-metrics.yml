name: Refresh metrics

on:
  # On-demand only: a maintainer triggers this from the Actions tab (or
  # `gh workflow run`) when data/metrics.json and the end user member list
  # should be brought up to date, rather than refreshing on a schedule.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# Serialised on the branch this workflow force-pushes; see the note in
# refresh-radar-reports.yml. workflow_dispatch only, so two runs overlap as
# soon as the button is pressed twice. Not cancelled, for the same reason.
concurrency:
  group: automation/refresh-metrics
  cancel-in-progress: false

env:
  NODE_VERSION: '22'

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run collect:metrics
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm run collect:enduser-members
      - run: npm run validate:enduser-members
      - run: npm run generate:members
      - run: npm run fix:format
      - run: npm run validate:metrics
      - run: npm run validate:members
      - run: npm run test:unit
      - run: npm run build
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: automation/refresh-metrics
          delete-branch: true
          commit-message: 'chore: refresh metrics'
          title: 'chore: refresh metrics and member data'
          body: |
            Automated refresh of `data/metrics.json`, the end user member
            list and the generated member directory.

            Validation, the unit tests and the production build passed.
          labels: automated
          signoff: true
