name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  NODE_VERSION: '22'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

      - name: Validate generated metrics
        run: npm run validate:metrics

      - name: Validate generated architectures
        run: npm run validate:architectures

      - name: Validate architecture assets
        run: npm run validate:architecture-assets

      - name: Validate awards data
        run: npm run validate:awards

      # Build for the GitHub Pages project URL. When the custom domain in
      # static/CNAME is verified and active, update these values to
      # SITE_URL=https://endusers.cncf.io and BASE_URL=/ so canonical and
      # Open Graph URLs point to the production domain.
      - name: Build website
        env:
          SITE_URL: https://castrojo.github.io
          BASE_URL: /endusers/
        run: npm run build:production

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
