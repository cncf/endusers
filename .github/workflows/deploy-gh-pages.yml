name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  NODE_VERSION: '22'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

      - name: Validate generated metrics
        run: npm run validate:metrics

      - name: Validate generated architectures
        run: npm run validate:architectures

      - name: Validate architecture assets
        run: npm run validate:architecture-assets

      - name: Validate awards data
        run: npm run validate:awards

      # Automation pull requests are authored by github.token, which does not
      # start ci.yml (see #755), so this job is the only gate their data ever
      # passes before it publishes. It has to run the full validator set, not
      # a subset.
      - name: Validate button contrast
        run: npm run validate:button-contrast

      - name: Validate launch metrics data
        run: npm run validate:launch-metrics

      - name: Validate case studies data
        run: npm run validate:case-studies

      - name: Validate radar reports data
        run: npm run validate:radar-reports

      - name: Validate community people data
        run: npm run validate:community-people

      - name: Validate community group links
        run: npm run validate:community-groups

      - name: Validate projects-born data
        run: npm run validate:projects-born

      - name: Validate End User landscape data
        run: npm run validate:enduser-members

      - name: Validate members data
        run: npm run validate:members

      # Build for the GitHub Pages project URL. When the custom domain in
      # static/CNAME is verified and active, update these values to
      # SITE_URL=https://endusers.cncf.io and BASE_URL=/ so canonical and
      # Open Graph URLs point to the production domain.
      - name: Build website
        env:
          SITE_URL: https://cncf.github.io
          BASE_URL: /endusers/
        run: npm run build:production

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
