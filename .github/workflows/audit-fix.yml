name: Dependency audit fix

# audit-schedule.yml re-runs the advisory gate daily and, by its own contract,
# opens nothing: a red run is the notification. Each of its last three red
# runs was then resolved by hand with the same mechanical step, a lockfile
# bump to a patched release that already sat inside the ranges package.json
# allows. This workflow runs that step when the scheduled audit fails, and
# opens the pull request if the gate is green on the result.
#
# It is a separate workflow rather than a second job there so the audit lane
# keeps its read-only token and single-gate cost (tests/audit-schedule-
# contract.test.mjs pins both), and only this lane holds write scope.
#
# `npm audit fix --package-lock-only` moves nothing outside the existing
# semver ranges and never touches package.json, so the diff a reviewer sees is
# the lockfile alone. When the gate is still red afterwards the patched release
# is outside the ranges, which needs an `overrides` floor and a SECURITY.md row
# a person has to choose; this job then fails and the scheduled red run stays
# the notification, as before.
#
# A pull request opened with the workflow token does not itself trigger ci.yml;
# a maintainer closes and reopens it, or pushes to it, to start the checks.

on:
  workflow_run:
    workflows: [Dependency audit]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Serialised on the branch this workflow force-pushes; see the note in
# refresh-radar-reports.yml. Not cancelled, for the same reason.
concurrency:
  group: automation/audit-fix
  cancel-in-progress: false

jobs:
  remediate:
    name: Open a lockfile fix for the advisories npm can patch in range
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    # A green or cancelled audit run leaves nothing to fix.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'failure'
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-deps
      # Proceed only when the gate is red on main as checked out. A manual
      # dispatch while it is green would otherwise still rewrite the lockfile:
      # `npm audit fix` normalises fields npm no longer emits, and the result
      # would be a pull request that moves no advisory.
      - name: Confirm the gate is red
        id: gate
        run: |
          if npm run check:audit; then
            echo 'red=false' >> "$GITHUB_OUTPUT"
          else
            echo 'red=true' >> "$GITHUB_OUTPUT"
          fi
      # Rewrites package-lock.json only; the re-run gate below reads it.
      - if: steps.gate.outputs.red == 'true'
        run: npm audit fix --package-lock-only
      - if: steps.gate.outputs.red == 'true'
        run: npm ci
      - if: steps.gate.outputs.red == 'true'
        run: npm run check:audit
      - if: steps.gate.outputs.red == 'true'
        run: npm run test:unit
      - if: steps.gate.outputs.red == 'true'
        uses: ./.github/actions/open-automation-pr
        with:
          branch: automation/audit-fix
          commit-message: 'fix(deps): move patched advisories in the lockfile'
          title: 'fix(deps): move patched advisories in the lockfile'
          body: |
            The scheduled dependency audit failed on `main`, and
            `npm audit fix --package-lock-only` resolved every gated advisory
            inside the lockfile's existing semver ranges. No `overrides`
            floor or `package.json` change was needed.

            `npm run check:audit` and the unit suite passed on this lockfile.

            Remit: security exposure; `npm run check:audit` failing on `main`.
