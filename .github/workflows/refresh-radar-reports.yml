name: Refresh radar reports

on:
  schedule:
    - cron: '57 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  NODE_VERSION: '22'

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run collect:radar-reports
      - run: npm run fix:format
      - run: npm run validate:radar-reports
      - run: npm run test:unit
      - run: npm run build
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: automation/refresh-radar-reports
          delete-branch: true
          commit-message: 'chore: refresh radar reports'
          title: 'chore: refresh radar reports'
          body: |
            Automated refresh of `data/radar-reports.json` from
            https://www.cncf.io/reports?_sft_lf-report-type=radar.

            New reports get a placeholder summary (flagged as a warning by
            `npm run validate:radar-reports`); replace it with a real
            one-sentence description before merging.
          labels: automated
          signoff: true
