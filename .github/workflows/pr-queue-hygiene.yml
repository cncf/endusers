name: PR queue hygiene

on:
  schedule:
    - cron: '43 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hygiene:
    name: Flag stale conflicting PRs
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run PR queue hygiene
        run: npm run pr-queue-hygiene
        env:
          GH_TOKEN: ${{ github.token }}
