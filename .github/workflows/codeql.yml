name: CodeQL

on:
  push:
    branches: [main]
    paths:
      - '**/*.js'
      - '**/*.jsx'
      - '**/*.mjs'
      - '**/*.cjs'
      - '**/*.ts'
      - '**/*.tsx'
      - package.json
      - package-lock.json
      - '.github/actions/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - '**/*.js'
      - '**/*.jsx'
      - '**/*.mjs'
      - '**/*.cjs'
      - '**/*.ts'
      - '**/*.tsx'
      - package.json
      - package-lock.json
      - '.github/actions/**'
      - '.github/workflows/**'
  schedule:
    - cron: '31 7 * * 1'

permissions:
  contents: read

# Not a required status check, so it is safe to skip entirely (rather than
# just cancel) when a PR touches neither JavaScript/TypeScript source nor a
# workflow or composite action: an unmatched path means the workflow never
# starts, and nothing here gates the merge queue on it. The weekly schedule run still scans the
# full tree regardless of what changed most recently.
concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      # One language failing must not hide the other language's results.
      fail-fast: false
      matrix:
        # `actions` analyses the workflow files and the composite actions under
        # .github/actions they call: script injection through
        # ${{ github.event.* }} in `run:` blocks, over-broad GITHUB_TOKEN
        # permissions, un-pinned third-party actions. Nothing else in this
        # repository reads the workflows statically.
        language: ['javascript-typescript', 'actions']
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: '/language:${{ matrix.language }}'
