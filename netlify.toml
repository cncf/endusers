# Build settings for the Netlify site `endusers` (ADR 0005). This file is the
# single source of truth; the Netlify UI build settings defer to it.
#
# build:netlify runs every validate:* target ci.yml runs, then the production
# build. Automation pull requests are authored by github.token and never start
# ci.yml (#755), so this build is the only gate their data passes before it
# publishes: a failed validator fails the deploy and the previous deploy stays
# live. SITE_URL is derived per deploy context by scripts/netlify-build.mjs
# (production: URL; previews: DEPLOY_PRIME_URL), so canonical and Open Graph
# URLs follow the host without a config change at the DNS cutover.

[build]
  command = "npm run build:netlify"
  publish = "build"

[build.environment]
  NODE_VERSION = "22"

# Response headers. The HTML catch-all sends the complete page policy as a
# header rather than leaving the fetch directives to the <meta> tag in
# docusaurus.config.js alone: a meta policy cannot carry frame-ancestors, does
# not reach a .svg or .json opened directly, and only starts to apply once the
# parser reaches it. The fetch and navigation directives below restate the
# production meta policy word for word -- tests/netlify-publish-contract.test.mjs
# fails if the two disagree, and requires every block that sends a CSP to name
# a fixed baseline (default-src, object-src 'none', base-uri, form-action,
# frame-ancestors), so a missing directive fails CI instead of being found in
# production one header at a time.
#
# The header adds what the meta tag does not have:
# - default-src 'self', so a fetch directive neither policy names inherits
#   this origin instead of being unrestricted;
# - frame-ancestors 'self' (with X-Frame-Options for older browsers), which
#   browsers ignore in a meta tag;
# - upgrade-insecure-requests, so an http:// subresource that reaches a page is
#   fetched over HTTPS rather than refused or sent in cleartext.
#
# script-src keeps 'unsafe-inline' because hashes cannot describe it. Docusaurus
# inlines a color-mode bootstrap on every page whose localStorage key carries a
# hash of the site URL, and scripts/netlify-build.mjs gives every deploy
# preview its own URL, so one static hash here would match production and block
# the script on every preview (or the reverse). 'self' still refuses every
# off-origin script. 'unsafe-eval' is not needed by the production bundle.
#
# Permissions-Policy turns off powerful features the site never uses, so a
# script that reached a page could not ask for them. clipboard-write is left
# alone: the code-block copy button uses it.
#
# Strict-Transport-Security is the one control here that protects the response
# rather than constrains it. Netlify does not send it on its own -- its HTTPS
# documentation requires the site to set it in this file -- so without it a
# browser sent to http:// makes one cleartext request before the redirect, and
# an attacker on that path answers it instead of redirecting. Every other
# header in this block travels *inside* the response, so a stripped connection
# simply omits them all; this is the only one that survives, because the
# browser remembers it. max-age is one year, the hstspreload.org minimum.
# includeSubDomains is safe for a host that serves no sub-subdomains of its
# own. `preload` is deliberately absent: it is an effectively irreversible
# commitment held by browser vendors over the apex domain, so it belongs to
# whoever administers cncf.io, not to this file, and can be added later
# without rework.
[[headers]]
  for = "/*"

  [headers.values]
    Content-Security-Policy = "frame-ancestors 'self'; default-src 'self'; base-uri 'self'; object-src 'none'; frame-src 'none'; media-src 'none'; connect-src 'self'; font-src 'self'; manifest-src 'self'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://raw.githubusercontent.com https://avatars.githubusercontent.com https://github.com https://www.github.com https://cncf.io https://*.cncf.io; upgrade-insecure-requests"
    Permissions-Policy = "accelerometer=(), autoplay=(), browsing-topics=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(), geolocation=(), gyroscope=(), hid=(), idle-detection=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), serial=(), usb=(), xr-spatial-tracking=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"

# Directly-opened assets. A browser that navigates to an SVG renders it as a
# document in this origin, so the SVG gate in validate:architecture-assets is the
# primary control and the <meta> fetch directives in docusaurus.config.js never
# reach the response at all (CONTENT-SECURITY.md, "Residual risks"). A response
# header does reach it. script-src 'none' is not a second copy of the host
# allowlists kept in docusaurus.config.js -- it is a flat denial that is only
# correct for a response that is never a page, so it cannot drift from them.
#
# default-src 'none' is here for the reason docusaurus.config.js gives for the
# meta policy: a fetch directive this header does not name is unrestricted, not
# inherited. Without it, script-src and object-src made a directly-opened SVG
# inert but left it free to *fetch* -- an <image href> on any host, an @import,
# a url() in a presentation attribute, a remote @font-face, an <iframe> inside
# <foreignObject> -- so a visitor's IP, User-Agent and Referer still reached a
# host the diagram's author chose whenever the parser gate was bypassed. That
# gate is the primary control; this is the layer that has to hold when it does
# not.
#
# form-action and base-uri are here for the same reason stated the other way
# round: they are navigation directives, not fetch directives, so default-src
# is not their fallback either -- an unnamed one of them is unrestricted no
# matter how flat the denial above it looks. A directly-opened SVG renders the
# HTML inside <foreignObject>, and script-src 'none' makes that HTML inert
# without constraining a <form> at all: its submission, and whatever a visitor
# typed into it, goes wherever the diagram's author pointed it while the
# address bar still reads as this origin. docusaurus.config.js already sends
# form-action for pages; 'none' rather than 'self' is correct here because a
# response under static/img never submits a form or resolves a relative
# reference against a <base>, so neither allowance would describe anything the
# corpus does.
#
# The three allowances are what the published corpus actually uses and nothing
# more: inline <style> blocks and style= attributes from draw.io exports,
# inline data:image/png payloads, and (for parity with docusaurus.config.js)
# same-origin fonts, of which static/ currently declares none. Still no host
# list, so this block cannot drift from the allowlists in docusaurus.config.js.
#
# These paths are every directory scripts/validate-architecture-assets.mjs walks,
# which is every directory in static/ that holds an SVG plus the architecture
# images in docs/architectures/<id>/images/, which the build publishes at
# /img/architectures/<id>/ (endusersArchitectureImages in docusaurus.config.js).
# The site-wide values are restated because Netlify does not document how it
# merges a header name set by both a broad and a narrow matching rule;
# restating is correct either way.
[[headers]]
  for = "/img/*"

  [headers.values]
    Content-Security-Policy = "frame-ancestors 'self'; default-src 'none'; form-action 'none'; base-uri 'none'; script-src 'none'; object-src 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'"
    Permissions-Policy = "accelerometer=(), autoplay=(), browsing-topics=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(), geolocation=(), gyroscope=(), hid=(), idle-detection=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), serial=(), usb=(), xr-spatial-tracking=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"

[[headers]]
  for = "/favicons/*"

  [headers.values]
    Content-Security-Policy = "frame-ancestors 'self'; default-src 'none'; form-action 'none'; base-uri 'none'; script-src 'none'; object-src 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'"
    Permissions-Policy = "accelerometer=(), autoplay=(), browsing-topics=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(), geolocation=(), gyroscope=(), hid=(), idle-detection=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), serial=(), usb=(), xr-spatial-tracking=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"

# Host redirects. architecture.cncf.io served the reference architecture
# catalogue before it moved here (ADR 0001); its DNS now points at Netlify and
# this build answers on it, which publishes the whole site a second time under
# a host whose canonical URLs all say endusers.cncf.io. Every request on that
# host is sent to the catalogue instead. Deep links keep their path because the
# architecture ids did not change in the move; anything else lands on the
# catalogue index. Rules are evaluated in order, so the path-preserving rule
# must stay above the catch-all. The scheme is part of the match; Netlify
# upgrades http:// to https:// before redirect rules run, so one https rule
# covers both. force = true applies the rule even though the build holds a
# file at the path.
[[redirects]]
  from = "https://architecture.cncf.io/architectures/*"
  to = "https://endusers.cncf.io/architectures/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://architecture.cncf.io/*"
  to = "https://endusers.cncf.io/architectures/"
  status = 301
  force = true
