<text x="36.0" y="616.9" text-anchor="start" font-size="13" font-style="italic" fill="#475569">manages the rest directly.</text>
<text x="36.0" y="638.0" text-anchor="start" font-size="13" font-style="italic" fill="#475569">Cost for these accounts follows the account boundary.</text>
<text x="1040.0" y="662.0" text-anchor="end" font-size="12.5" font-style="italic" fill="#475569">Chips a, b and c are pods of three tenants</text>
<text x="20.0" y="662.0" text-anchor="start" font-size="12.5" font-style="italic" fill="#475569">Red dashed lines: the team boundary, enforced in the network and in workload identity</text>
