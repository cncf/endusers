<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="1060" height="668" viewBox="0 0 1060 668" role="img" aria-labelledby="dvsp-tenant-model-title dvsp-tenant-model-desc">
<title id="dvsp-tenant-model-title">A tenant has two borders</title>
<desc id="dvsp-tenant-model-desc">Creating a team&#x27;s accounts emits an account-created event; the platform creates a Tenant in Git, the Tenant Operator turns it into the team&#x27;s namespaces on the shared clusters, and the team&#x27;s access in its own development and production accounts is set up automatically. Pods from several tenants share each node, and the team boundary is enforced in the network and in workload identity.</desc>
