<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="1060" height="936" viewBox="0 0 1060 936" role="img" aria-labelledby="dvsp-overview-title dvsp-overview-desc">
<title id="dvsp-overview-title">DVSP at a glance</title>
<desc id="dvsp-overview-desc">Five layers: developer surface, delivery, edge, the cluster fleet and the cloud accounts, with identity and telemetry across them. Numbered markers follow a new service: 1 scaffold with the scaffolder, 2 account and tenant creation, 3 build with the hosted CI service, 4 deploy with Argo CD, 5 release with Argo Rollouts, 6 serve readers through the CDN and the ingress gateway, 7 telemetry.</desc>
