<text x="225.0" y="524.2" text-anchor="middle" font-size="13.5" fill="#0F172A">Service pods; ztunnel on each node; a waypoint per</text>
<text x="225.0" y="542.0" text-anchor="middle" font-size="13.5" fill="#0F172A">namespace</text>
<rect x="416.0" y="454.0" width="250.0" height="128.0" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.4"/>
<text x="541.0" y="502.9" text-anchor="middle" font-size="15" font-weight="700" fill="#4C1D95">Ingress gateway</text>
<text x="541.0" y="524.2" text-anchor="middle" font-size="13.5" fill="#0F172A">Shared and Envoy-based; routes to</text>
<text x="541.0" y="542.0" text-anchor="middle" font-size="13.5" fill="#0F172A">services</text>
<rect x="682.0" y="454.0" width="326.0" height="128.0" rx="8" fill="#FFFFFF" stroke="#059669" stroke-width="1.4"/>
<text x="845.0" y="502.9" text-anchor="middle" font-size="15" font-weight="700" fill="#064E3B">Platform controllers</text>
<text x="845.0" y="524.2" text-anchor="middle" font-size="13.5" fill="#0F172A">Tenant Operator, Karpenter, KEDA,</text>
<text x="845.0" y="542.0" text-anchor="middle" font-size="13.5" fill="#0F172A">Gatekeeper, secrets operator</text>
<rect x="36.0" y="672.0" width="484.0" height="86.0" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="1.4"/>
<text x="46.0" y="691.0" text-anchor="start" font-size="15" font-weight="700" fill="#78350F">Team accounts</text>
<text x="46.0" y="712.3" text-anchor="start" font-size="13.5" fill="#0F172A">The development account backs development and staging; the</text>
<text x="46.0" y="730.1" text-anchor="start" font-size="13.5" fill="#0F172A">production account backs production. Databases, queues and workload</text>
<text x="46.0" y="747.9" text-anchor="start" font-size="13.5" fill="#0F172A">roles live here, billed to the team.</text>
<rect x="546.0" y="672.0" width="214.0" height="86.0" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.4"/>
<text x="653.0" y="699.9" text-anchor="middle" font-size="15" font-weight="700" fill="#78350F">Account factory</text>
<text x="653.0" y="721.2" text-anchor="middle" font-size="13.5" fill="#0F172A">Landing-zone service;</text>
<text x="653.0" y="739.0" text-anchor="middle" font-size="13.5" fill="#0F172A">baseline applied as code</text>
<rect x="776.0" y="672.0" width="248.0" height="86.0" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="1.4"/>
<text x="900.0" y="699.9" text-anchor="middle" font-size="15" font-weight="700" fill="#78350F">Network hub</text>
<text x="900.0" y="721.2" text-anchor="middle" font-size="13.5" fill="#0F172A">Opt-in connectivity between</text>
<text x="900.0" y="739.0" text-anchor="middle" font-size="13.5" fill="#0F172A">accounts and clusters</text>
<rect x="20.0" y="788.0" width="500.0" height="130.0" rx="8" fill="#FFE4E6" stroke="#E11D48" stroke-width="1.4"/>
<text x="30.0" y="820.1" text-anchor="start" font-size="15" font-weight="700" fill="#881337">Identity and policy (cross-cutting)</text>
<text x="30.0" y="841.3" text-anchor="start" font-size="13.5" fill="#0F172A">Single sign-on for engineers · Workload identity into the team&#x27;s own</text>
<text x="30.0" y="859.2" text-anchor="start" font-size="13.5" fill="#0F172A">accounts · Secrets through a Kubernetes operator · Mutual TLS with</text>
<text x="30.0" y="877.0" text-anchor="start" font-size="13.5" fill="#0F172A">SPIFFE identities in the mesh · Network and admission policy at the team</text>
<text x="30.0" y="894.8" text-anchor="start" font-size="13.5" fill="#0F172A">boundary, set up automatically for each tenant</text>
<rect x="540.0" y="788.0" width="500.0" height="130.0" rx="8" fill="#F1F5F9" stroke="#64748B" stroke-width="1.4"/>
<text x="550.0" y="820.1" text-anchor="start" font-size="15" font-weight="700" fill="#1E293B">Telemetry (cross-cutting)</text>
<text x="550.0" y="841.3" text-anchor="start" font-size="13.5" fill="#0F172A">Traces and metrics: OpenTelemetry wrapper libraries for Go, Node.js,</text>
<text x="550.0" y="859.2" text-anchor="start" font-size="13.5" fill="#0F172A">Python and the Java virtual machine export them over the OpenTelemetry</text>
<text x="550.0" y="877.0" text-anchor="start" font-size="13.5" fill="#0F172A">protocol to a commercial observability platform · Logs: a log management</text>
<text x="550.0" y="894.8" text-anchor="start" font-size="13.5" fill="#0F172A">service · Default alerts from the chart</text>
