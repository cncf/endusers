<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="1060" height="652" viewBox="0 0 1060 652" role="img" aria-labelledby="dvsp-delivery-title dvsp-delivery-desc">
<title id="dvsp-delivery-title">The paved path</title>
<desc id="dvsp-delivery-desc">The scaffolder creates the service repository; the hosted CI service builds images; Argo CD on the operations clusters watches Git and syncs the pinned platform chart to the workload clusters; Argo Rollouts canaries releases against metric analysis for services that opt in. Chart releases reach repositories as Renovate pull requests. Pull requests can run as ephemeral deployments in development, selected per request with the W3C baggage header.</desc>
<defs><marker id="dvsp-delivery-arrow-059669" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="dvsp-delivery-arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="dvsp-delivery-arrow-475569" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="dvsp-delivery-arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs>
