<rect x="36.0" y="88.0" width="184.0" height="118.0" rx="8" fill="#F1F5F9" stroke="#64748B" stroke-width="1.4"/>
<text x="128.0" y="123.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1E293B">Scaffolder</text>
<text x="128.0" y="144.3" text-anchor="middle" font-size="13.5" fill="#0F172A">A self-service form and a</text>
<text x="128.0" y="162.1" text-anchor="middle" font-size="13.5" fill="#0F172A">Go API that create the</text>
<text x="128.0" y="179.9" text-anchor="middle" font-size="13.5" fill="#0F172A">repository from templates</text>
<rect x="236.0" y="88.0" width="184.0" height="118.0" rx="8" fill="#F1F5F9" stroke="#64748B" stroke-width="1.4"/>
<text x="328.0" y="114.1" text-anchor="middle" font-size="15" font-weight="700" fill="#1E293B">Service repository</text>
<text x="328.0" y="135.3" text-anchor="middle" font-size="13.5" fill="#0F172A">App code, a CI pipeline,</text>
<text x="328.0" y="153.2" text-anchor="middle" font-size="13.5" fill="#0F172A">and per-environment</text>
<text x="328.0" y="171.0" text-anchor="middle" font-size="13.5" fill="#0F172A">Kustomize that pins a</text>
<text x="328.0" y="188.8" text-anchor="middle" font-size="13.5" fill="#0F172A">platform chart version</text>
<rect x="436.0" y="88.0" width="184.0" height="118.0" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.4"/>
<text x="528.0" y="123.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A8A">Hosted CI</text>
<text x="528.0" y="144.3" text-anchor="middle" font-size="13.5" fill="#0F172A">Self-hosted runners that</text>
<text x="528.0" y="162.1" text-anchor="middle" font-size="13.5" fill="#0F172A">scale with demand;</text>
<text x="528.0" y="179.9" text-anchor="middle" font-size="13.5" fill="#0F172A">images to the registry</text>
<rect x="636.0" y="88.0" width="184.0" height="118.0" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.4"/>
<text x="728.0" y="131.9" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A8A">Argo CD</text>
<text x="728.0" y="153.2" text-anchor="middle" font-size="13.5" fill="#0F172A">On operations clusters;</text>
<text x="728.0" y="171.0" text-anchor="middle" font-size="13.5" fill="#0F172A">ApplicationSets</text>
<rect x="836.0" y="88.0" width="188.0" height="118.0" rx="8" fill="#D1FAE5" stroke="#059669" stroke-width="1.4"/>
<text x="930.0" y="123.0" text-anchor="middle" font-size="15" font-weight="700" fill="#064E3B">Workload clusters</text>
<text x="930.0" y="144.3" text-anchor="middle" font-size="13.5" fill="#0F172A">Development, staging and</text>
<text x="930.0" y="162.1" text-anchor="middle" font-size="13.5" fill="#0F172A">production, in each of the</text>
<text x="930.0" y="179.9" text-anchor="middle" font-size="13.5" fill="#0F172A">service&#x27;s regions</text>
<rect x="36.0" y="300.0" width="148.0" height="106.0" rx="8" fill="#FFFFFF" stroke="#64748B" stroke-width="1.4"/>
<text x="110.0" y="329.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1E293B">Platform chart</text>
<text x="110.0" y="350.3" text-anchor="middle" font-size="13.5" fill="#0F172A">Core team plus</text>
<text x="110.0" y="368.1" text-anchor="middle" font-size="13.5" fill="#0F172A">feature owners</text>
<text x="110.0" y="385.9" text-anchor="middle" font-size="13.5" fill="#0F172A">(code-owner rules)</text>
<rect x="200.0" y="300.0" width="148.0" height="106.0" rx="8" fill="#FFFFFF" stroke="#64748B" stroke-width="1.4"/>
<text x="274.0" y="337.9" text-anchor="middle" font-size="15" font-weight="700" fill="#1E293B">Artifact registry</text>
<text x="274.0" y="359.2" text-anchor="middle" font-size="13.5" fill="#0F172A">Versioned chart</text>
<text x="274.0" y="377.0" text-anchor="middle" font-size="13.5" fill="#0F172A">releases</text>
<rect x="364.0" y="300.0" width="140.0" height="106.0" rx="8" fill="#FFFFFF" stroke="#64748B" stroke-width="1.4"/>
<text x="434.0" y="329.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1E293B">Renovate</text>
<text x="434.0" y="350.3" text-anchor="middle" font-size="13.5" fill="#0F172A">Upgrade pull</text>
<text x="434.0" y="368.1" text-anchor="middle" font-size="13.5" fill="#0F172A">requests in</text>
<text x="434.0" y="385.9" text-anchor="middle" font-size="13.5" fill="#0F172A">scaffolded repos</text>
<rect x="556.0" y="300.0" width="220.0" height="106.0" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.4"/>
<text x="666.0" y="329.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A8A">Argo Rollouts canary</text>
<text x="666.0" y="350.3" text-anchor="middle" font-size="13.5" fill="#0F172A">Shifts weight between stable</text>
<text x="666.0" y="368.1" text-anchor="middle" font-size="13.5" fill="#0F172A">and canary on an Istio</text>
<text x="666.0" y="385.9" text-anchor="middle" font-size="13.5" fill="#0F172A">VirtualService</text>
<rect x="804.0" y="300.0" width="220.0" height="106.0" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.4"/>
<text x="914.0" y="329.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A8A">Metric analysis</text>
<text x="914.0" y="350.3" text-anchor="middle" font-size="13.5" fill="#0F172A">Error rate, restarts,</text>
<text x="914.0" y="368.1" text-anchor="middle" font-size="13.5" fill="#0F172A">out-of-memory kills; a failed</text>
<text x="914.0" y="385.9" text-anchor="middle" font-size="13.5" fill="#0F172A">run aborts</text>
<rect x="36.0" y="482.0" width="232.0" height="132.0" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.4"/>
<text x="152.0" y="541.8" text-anchor="middle" font-size="15" font-weight="700" fill="#1E293B">Open pull request #3</text>
<text x="152.0" y="563.1" text-anchor="middle" font-size="13.5" fill="#0F172A">on service-b</text>
<rect x="288.0" y="482.0" width="232.0" height="132.0" rx="8" fill="#D1FAE5" stroke="#059669" stroke-width="1.4"/>
<text x="404.0" y="524.0" text-anchor="middle" font-size="15" font-weight="700" fill="#064E3B">Ephemeral deployment</text>
<text x="404.0" y="545.3" text-anchor="middle" font-size="13.5" fill="#0F172A">service-b, built from pull request</text>
<text x="404.0" y="563.1" text-anchor="middle" font-size="13.5" fill="#0F172A">3, runs in the development</text>
<text x="404.0" y="580.9" text-anchor="middle" font-size="13.5" fill="#0F172A">cluster</text>
<rect x="540.0" y="482.0" width="232.0" height="132.0" rx="8" fill="#D1FAE5" stroke="#059669" stroke-width="1.4"/>
<text x="656.0" y="515.1" text-anchor="middle" font-size="15" font-weight="700" fill="#064E3B">Request carries baggage</text>
<text x="656.0" y="536.3" text-anchor="middle" font-size="13.5" fill="#0F172A">Names pull requests for chosen</text>
<text x="656.0" y="554.2" text-anchor="middle" font-size="13.5" fill="#0F172A">services</text>
<text x="656.0" y="572.0" text-anchor="middle" font-size="13.5" fill="#0F172A">The chart&#x27;s VirtualService routes</text>
<text x="656.0" y="589.8" text-anchor="middle" font-size="13.5" fill="#0F172A">on it</text>
<rect x="792.0" y="482.0" width="232.0" height="132.0" rx="8" fill="#D1FAE5" stroke="#059669" stroke-width="1.4"/>
<text x="908.0" y="506.0" text-anchor="middle" font-size="15" font-weight="700" fill="#064E3B">Deeper calls keep the</text>
<text x="908.0" y="524.3" text-anchor="middle" font-size="15" font-weight="700" fill="#064E3B">header</text>
<text x="908.0" y="545.5" text-anchor="middle" font-size="13.5" fill="#0F172A">OpenTelemetry wrappers</text>
<text x="908.0" y="563.3" text-anchor="middle" font-size="13.5" fill="#0F172A">propagate baggage; everything</text>
<text x="908.0" y="581.1" text-anchor="middle" font-size="13.5" fill="#0F172A">else uses the development</text>
<text x="908.0" y="599.0" text-anchor="middle" font-size="13.5" fill="#0F172A">versions</text>
<rect x="473.3" y="221.9" width="129.4" height="20.2" rx="4" fill="#FFFFFF" fill-opacity="0.94"/>
<text x="538.0" y="235.9" text-anchor="middle" font-size="13" fill="#475569">Argo CD watches Git</text>
<rect x="276.7" y="236.9" width="126.5" height="20.2" rx="4" fill="#FFFFFF" fill-opacity="0.94"/>
<text x="340.0" y="250.9" text-anchor="middle" font-size="13" fill="#475569">upgrade pull request</text>
<text x="20.0" y="34.0" text-anchor="start" font-size="18" font-weight="700" fill="#0F172A">The paved path: from the scaffolder to production, with opt-in canaries</text>
</g></svg>