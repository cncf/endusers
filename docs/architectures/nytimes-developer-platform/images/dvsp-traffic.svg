<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="1060" height="420" viewBox="0 0 1060 420" role="img" aria-labelledby="dvsp-traffic-title dvsp-traffic-desc">
<title id="dvsp-traffic-title">One front door in every region</title>
<desc id="dvsp-traffic-desc">Readers reach the CDN, which serves what it can from cache and sends the rest to the shared ingress gateway in a healthy region. The gateway hands requests to the ambient mesh and on to the service. Every region serves production; to evacuate a region we remove it from routing.</desc>
<defs><marker id="dvsp-traffic-arrow-059669" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="dvsp-traffic-arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker></defs>
<g font-family="Arial, 'Liberation Sans', Helvetica, sans-serif">
<rect x="0.5" y="0.5" width="1059" height="419" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
<rect x="20.0" y="220.0" width="1020.0" height="180.0" rx="10" fill="#ECFDF5" stroke="#34D399" stroke-width="1.4"/>
<text x="32.0" y="243.0" font-size="15" font-weight="700" fill="#064E3B">In each region</text>
<path d="M530.0,100.0 L530.0,120.0" fill="none" stroke="#7C3AED" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#dvsp-traffic-arrow-7c3aed)"/>
<path d="M530.0,182.0 L530.0,202.0 L190.0,202.0 L190.0,262.0" fill="none" stroke="#7C3AED" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#dvsp-traffic-arrow-7c3aed)"/>
<path d="M340.0,321.0 L380.0,321.0" fill="none" stroke="#7C3AED" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#dvsp-traffic-arrow-7c3aed)"/>
<path d="M680.0,321.0 L720.0,321.0" fill="none" stroke="#059669" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#dvsp-traffic-arrow-059669)"/>
<rect x="430.0" y="56.0" width="200.0" height="44.0" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.4"/>
<text x="530.0" y="82.8" text-anchor="middle" font-size="15" font-weight="700" fill="#1E293B">Readers</text>
<rect x="400.0" y="120.0" width="260.0" height="62.0" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.4"/>
<text x="530.0" y="144.8" text-anchor="middle" font-size="15" font-weight="700" fill="#4C1D95">CDN</text>
<text x="530.0" y="166.1" text-anchor="middle" font-size="13.5" fill="#0F172A">Serves what it can from cache</text>
<rect x="40.0" y="262.0" width="300.0" height="118.0" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.4"/>
<text x="190.0" y="305.9" text-anchor="middle" font-size="15" font-weight="700" fill="#4C1D95">Ingress gateway</text>
<text x="190.0" y="327.2" text-anchor="middle" font-size="13.5" fill="#0F172A">Shared and Envoy-based; routes come</text>
<text x="190.0" y="345.0" text-anchor="middle" font-size="13.5" fill="#0F172A">from the services&#x27; charts</text>
<rect x="380.0" y="262.0" width="300.0" height="118.0" rx="8" fill="#FFFFFF" stroke="#059669" stroke-width="1.4"/>
<text x="530.0" y="305.9" text-anchor="middle" font-size="15" font-weight="700" fill="#064E3B">Ambient mesh</text>
<text x="530.0" y="327.2" text-anchor="middle" font-size="13.5" fill="#0F172A">ztunnel on every node; a waypoint per</text>
<text x="530.0" y="345.0" text-anchor="middle" font-size="13.5" fill="#0F172A">namespace</text>
<rect x="720.0" y="262.0" width="300.0" height="118.0" rx="8" fill="#D1FAE5" stroke="#059669" stroke-width="1.4"/>
<text x="870.0" y="305.9" text-anchor="middle" font-size="15" font-weight="700" fill="#064E3B">Service pods</text>
<text x="870.0" y="327.2" text-anchor="middle" font-size="13.5" fill="#0F172A">Reach their data in their team&#x27;s own</text>
<text x="870.0" y="345.0" text-anchor="middle" font-size="13.5" fill="#0F172A">accounts</text>
<text x="20.0" y="34.0" text-anchor="start" font-size="18" font-weight="700" fill="#0F172A">One front door in every region</text>
<text x="40.0" y="132.0" text-anchor="start" font-size="13" font-style="italic" fill="#475569">To evacuate a region, we remove it from routing; the</text>
<text x="40.0" y="148.9" text-anchor="start" font-size="13" font-style="italic" fill="#475569">switch needs no action from teams whose services run in</text>
<text x="40.0" y="165.8" text-anchor="start" font-size="13" font-style="italic" fill="#475569">more than one region.</text>
<text x="700.0" y="132.0" text-anchor="start" font-size="13" font-style="italic" fill="#475569">Every region serves production; services opt into</text>
<text x="700.0" y="148.9" text-anchor="start" font-size="13" font-style="italic" fill="#475569">multi-region in the scaffolder.</text>
</g></svg>