ignorePaths:
  - node_modules/**
  - build/**
  - package-lock.json
  - '**/*.svg'
  - '**/*.json'
  # Rendered from git history on every build; gitignored and not editable.
  - docs/resources/changelog.md
ignoreRegExpList:
